---
name: Build Linux release
description: Package and verify five Linux installer formats on a matching native Ubuntu 24.04 runner.

inputs:
  tag:
    description: Release tag (vMAJOR.MINOR.PATCH)
    required: true
  arch:
    description: Native Linux architecture (amd64 or arm64)
    required: true

outputs:
  artifact-name:
    description: Uploaded artifact name
    value: ${{ steps.build.outputs.artifact-name }}
  package-paths:
    description: Newline-delimited verified package paths
    value: ${{ steps.build.outputs.package-paths }}
  checksum-paths:
    description: Newline-delimited SHA-256 sidecar paths
    value: ${{ steps.build.outputs.checksum-paths }}
  artifact-id:
    description: Uploaded artifact ID
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-url:
    description: Uploaded artifact URL
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - name: Validate release tag
      uses: $/.github/actions/validate-version
      with:
        tag: ${{ inputs.tag }}
    - name: Validate native Linux architecture
      shell: bash
      env:
        RAVEN_LINUX_ARCH: ${{ inputs.arch }}
      run: bash taskfiles/linux/funcs.sh validate-host
    - name: Set up Task
      uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e  # v2.2.0
    - name: Set up repository Go toolchain and cache
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.mod
          go.sum
    - name: Set up repository Bun version
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
      with:
        bun-version-file: package.json
    - name: Cache Bun downloads
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: ~/.bun/install/cache
        key: linux-bun-${{ runner.arch }}-${{ hashFiles('package.json', 'frontend/package.json', '**/bun.lock') }}
    - name: Test packaging failure handling
      shell: bash
      run: task linux:test
    - name: Install Linux dependencies
      shell: bash
      env:
        PACKAGE_ARCH: ${{ inputs.arch }}
      run: task linux:install:deps "ARCH=$PACKAGE_ARCH"
    - name: Build and verify Linux release
      id: build
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        PACKAGE_ARCH: ${{ inputs.arch }}
      run: |
        # Ubuntu 24.04 blocks user namespaces for AppImage's bundled bwrap.
        # Permit namespaces on this disposable runner while retaining WebKit's sandbox.
        userns_key=kernel.apparmor_restrict_unprivileged_userns
        userns_previous=$(sysctl -n "$userns_key")
        restore_userns() { sudo sysctl -w "$userns_key=$userns_previous"; }
        trap restore_userns EXIT
        sudo sysctl -w "$userns_key=0"
        task linux:release "TAG=$RELEASE_TAG" "ARCH=$PACKAGE_ARCH"
    - name: Upload verified packages and checksums
      id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: ${{ steps.build.outputs.artifact-name }}
        path: |
          ${{ steps.build.outputs.package-paths }}
          ${{ steps.build.outputs.checksum-paths }}
        if-no-files-found: error
