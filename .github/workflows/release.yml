---
name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: MSI version to verify without publishing (MAJOR.MINOR.PATCH)
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Validate stable MSI release tag
        id: version
        uses: $/.github/actions/validate-version
        with:
          tag: >-
            ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  windows:
    name: Build Windows ${{ matrix.arch }} MSI
    needs:
      - validate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build and upload Windows release
        uses: $/.github/actions/build-windows
        with:
          tag: v${{ needs.validate.outputs.version }}
          arch: ${{ matrix.arch }}
  publish:
    name: Publish verified MSI release
    if: github.event_name == 'push'
    needs:
      - validate
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Publish verified MSI files
        uses: $/.github/actions/publish-release
        with:
          tag: ${{ github.ref_name }}
          name: Raven ${{ github.ref_name }}
          artifact-pattern: raven-${{ github.ref_name }}-windows-*
          files: |-
            raven-${{ github.ref_name }}-windows-amd64/raven-${{ github.ref_name }}-windows-amd64.msi
            raven-${{ github.ref_name }}-windows-arm64/raven-${{ github.ref_name }}-windows-arm64.msi
