---
name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: MSI version to verify without publishing (MAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate stable MSI release tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: >-
            ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,4})$ ]]; then
            echo '::error::Expected a stable vMAJOR.MINOR.PATCH tag within MSI version limits.'
            exit 1
          fi
          IFS=. read -r major minor patch <<< "${RELEASE_TAG#v}"
          if (( 10#$major > 255 || 10#$minor > 255 || 10#$patch > 65535 )); then
            echo '::error::MSI version limits are 255.255.65535.'
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
  windows:
    name: Build Windows ${{ matrix.arch }} MSI
    needs:
      - validate
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version-file: package.json
          no-cache: true
      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e  # v2.2.0
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@baa11fbfe1d6520db94683bd5c7a3818018e4309  # v5.1.0
        with:
          dotnet-version: 10.0.x
      - name: Install Wails
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wails = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3
          if ($LASTEXITCODE -ne 0) { throw 'Could not determine Wails version' }
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$wails"
          if ($LASTEXITCODE -ne 0) { throw 'Wails installation failed' }
      - name: Test packaging validation
        shell: pwsh
        run: |
          task wix:test
          if ($LASTEXITCODE -ne 0) { throw 'Packaging validation tests failed' }
      - name: Build upgrade and replacement test fixtures
        shell: pwsh
        run: ./taskfiles/wix/fixtures.ps1 -Arch $env:PACKAGE_ARCH
      - name: Build and validate release MSI
        shell: pwsh
        run: |
          task windows:package "ARCH=$env:PACKAGE_ARCH" "VERSION=$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'MSI packaging failed' }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Packaging changed tracked sources' }
      - name: Upload release candidate and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: raven-${{ env.RELEASE_VERSION }}-windows-${{ matrix.arch }}
          path: |
            bin/raven-${{ env.RELEASE_VERSION }}-windows-${{ matrix.arch }}.msi
            bin/raven-${{ env.RELEASE_VERSION }}-windows-${{ matrix.arch }}.msi.sha256
          if-no-files-found: error
      - name: Upload test fixtures separately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: raven-msi-tests-${{ matrix.arch }}
          path: |
            bin/msi-tests/${{ matrix.arch }}/old.msi
            bin/msi-tests/${{ matrix.arch }}/new.msi
            bin/msi-tests/${{ matrix.arch }}/replacement.msi
          if-no-files-found: error
  installation:
    name: Verify native Windows ${{ matrix.arch }} installation
    needs:
      - validate
      - windows
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out installation tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Download exact release candidate and test fixtures
        shell: pwsh
        run: |
          gh run download $env:RUN_ID --name "raven-$env:RELEASE_VERSION-windows-$env:PACKAGE_ARCH" --dir dist
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed' }
          foreach ($arch in @('amd64', 'arm64')) {
            gh run download $env:RUN_ID --name "raven-msi-tests-$arch" --dir "bin/msi-tests/$arch"
            if ($LASTEXITCODE -ne 0) { throw 'Test fixture download failed' }
          }
      - name: Verify installation, repair, prerequisites, upgrades, and uninstall
        shell: pwsh
        run: ./taskfiles/wix/smoke.ps1 -Arch $env:PACKAGE_ARCH -Version $env:RELEASE_VERSION
      - name: Retain installer diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: raven-msi-logs-${{ matrix.arch }}
          path: bin/msi-logs/${{ matrix.arch }}/*.log
          if-no-files-found: warn
  publish:
    name: Publish verified MSI release
    if: github.event_name == 'push'
    needs:
      - validate
      - installation
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Download and verify exact release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($arch in @('amd64', 'arm64')) {
            gh run download $env:RUN_ID --name "raven-$env:RELEASE_VERSION-windows-$arch" --dir dist
            if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
            $name = "raven-$env:RELEASE_VERSION-windows-$arch.msi"
            $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ((Get-Content "dist/$name.sha256" -Raw).Trim() -cne "$hash  $name") {
              throw "Checksum mismatch: $name"
            }
          }
          if (@(Get-ChildItem dist -File).Count -ne 4) { throw 'Expected exactly two MSIs and two checksums' }
      - name: Publish MSI files and checksums
        shell: pwsh
        run: |-
          $assets = @()
          foreach ($arch in @('amd64', 'arm64')) {
            $name = "dist/raven-$env:RELEASE_VERSION-windows-$arch.msi"
            $assets += @($name, "$name.sha256")
          }
          gh release create $env:RELEASE_TAG @assets --verify-tag --generate-notes --title "Raven $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
