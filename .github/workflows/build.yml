---
name: Desktop builds

on:
  # push:
  # pull_request:
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.29
      - name: Install UI dependencies
        run: npm ci --prefix frontend
      - name: Generate bindings
        run: wails3 generate bindings -ts -i -clean
      - name: Check UI
        run: npm run check
      - name: Build desktop application
        run: npm run build
      - name: Check Go
        run: go vet ./...
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: |
          npm run package
          tar -czf bin/Raven-macOS.tar.gz -C bin raven.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Raven-${{ runner.os }}-${{ runner.arch }}
          path: |
            bin/raven
            bin/raven.exe
            bin/Raven-macOS.tar.gz
          if-no-files-found: error
