---
name: raven
arch: ${RAVEN_LINUX_ARCH}
platform: linux
version: ${RAVEN_LINUX_VERSION}
section: education
priority: optional
maintainer: Raven <gostafa@users.noreply.github.com>
description: Your quiet desktop companion.
vendor: Raven
homepage: https://github.com/gostafa/raven
license: MIT
release: '1'

contents:
  - src: ${RAVEN_LINUX_PAYLOAD}/usr/bin/raven
    dst: /usr/bin/raven
    expand: true
    file_info:
      mode: 493  # 0755
  - src: ${RAVEN_LINUX_PAYLOAD}/usr/share/icons/hicolor/1024x1024/apps/raven.png
    dst: /usr/share/icons/hicolor/1024x1024/apps/raven.png
    expand: true
  - src: ${RAVEN_LINUX_PAYLOAD}/usr/share/applications/raven.desktop
    dst: /usr/share/applications/raven.desktop
    expand: true

depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

scripts:
  postinstall: ./build/linux/nfpm/scripts/postinstall.sh
