---
name: raven
base: core24
version: '@VERSION@'
summary: Your quiet desktop companion
description: A little practice. A little more remembered.
title: Raven
icon: payload/usr/share/icons/hicolor/1024x1024/apps/raven.png
license: MIT
website: https://github.com/gostafa/raven
source-code: https://github.com/gostafa/raven
issues: https://github.com/gostafa/raven/issues
grade: stable
confinement: strict

platforms:
  '@ARCH@': null

apps:
  raven:
    command: usr/bin/raven
    desktop: usr/share/applications/raven.desktop
    extensions:
      - gnome
    plugs:
      - network
      - audio-playback
      - webkit-sandbox
    slots:
      - raven-instance
      - raven-application
    environment:
      WEBKIT_EXEC_PATH: $SNAP/usr/lib/@TRIPLET@/webkitgtk-6.0
      WEBKIT_INJECTED_BUNDLE_PATH: $SNAP/usr/lib/@TRIPLET@/webkitgtk-6.0/injected-bundle

layout:
  /usr/lib/@TRIPLET@/webkitgtk-6.0:
    bind: $SNAP/usr/lib/@TRIPLET@/webkitgtk-6.0

slots:
  raven-instance:
    interface: dbus
    bus: session
    name: app.raven.desktop.SingleInstance
  raven-application:
    interface: dbus
    bus: session
    name: org.wails.raven

plugs:
  webkit-sandbox:
    interface: browser-support
    allow-sandbox: true

parts:
  raven:
    plugin: dump
    source: payload
    stage-packages:
      - libwebkitgtk-6.0-4
      - libgtk-4-1
      - libnotify4
  cleanup:
    after:
      - raven
    plugin: nil
    build-snaps:
      - core24
      - gnome-46-2404
    override-prime: |-
      set -eu
      for provider in core24 gnome-46-2404; do
        cd "/snap/$provider/current"
        find . -type f,l \( -name '*.so' -o -name '*.so.*' \) \
          -exec rm -f "$CRAFT_PRIME/{}" \;
      done
