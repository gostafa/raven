---
version: '3.5'

includes:
  bun:
    taskfile: ../../taskotter/bun/Taskfile.yml
    internal: true

tasks:
  check:
    desc: Build embedded frontend assets and run TaskOtter CI checks
    cmds:
      - task: prepare
      - task: :taskotter:ci

  fix:
    desc: Build embedded frontend assets and run TaskOtter CI fixes
    cmds:
      - task: prepare
      - task: :taskotter:ci:fix

  prepare:
    desc: Build frontend assets required by Go package loading
    run: once
    cmds:
      - task: bun:install
      - task: _prepare:unix
      - task: _prepare:windows

  _prepare:unix:
    internal: true
    platforms:
      - linux
      - darwin
    cmds:
      - task: bun:_run:unix
        vars:
          ARGS: install --cwd frontend --frozen-lockfile --no-save
      - task: bun:_run:unix
        vars:
          ARGS: run --bun --cwd frontend build

  _prepare:windows:
    internal: true
    platforms:
      - windows
    cmds:
      - >-
        powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command
        "{{.WINGET_LOAD}}; \$ErrorActionPreference = 'Stop';
        \$env:CI = '1';
        \$bun = if (Get-Command bun -ErrorAction SilentlyContinue) { 'bun' }
        else { \"\$env:USERPROFILE\.bun\bin\bun.exe\" };
        & \$bun install --cwd frontend --frozen-lockfile --no-save;
        if (\$LASTEXITCODE -ne 0) { exit \$LASTEXITCODE };
        & \$bun run --bun --cwd frontend build; exit \$LASTEXITCODE"
