---
version: '3.5'

includes:
  common: ../common/Taskfile.yml

vars:
  LINUX_ARCH: '{{.ARCH | default ARCH}}'
  LINUX_VERSION: '{{.VERSION | default (trimPrefix "v" (.TAG | default ""))}}'
  LINUX_STAGE: '{{.ROOT_DIR}}/bin/.linux/{{.LINUX_ARCH}}'

env:
  PATH: '{{.ROOT_DIR}}/.tools:{{.PATH}}'
  RAVEN_LINUX_ROOT: '{{.ROOT_DIR}}'
  RAVEN_LINUX_ARCH: '{{.LINUX_ARCH}}'
  RAVEN_LINUX_VERSION: '{{.LINUX_VERSION}}'
  RAVEN_LINUX_TAG: '{{.TAG | default ""}}'
  RAVEN_LINUX_DEV: '{{.DEV | default "false"}}'
  RAVEN_LINUX_OBFUSCATED: '{{.OBFUSCATED | default "false"}}'
  RAVEN_LINUX_FORMAT: '{{.FORMAT | default "all"}}'

tasks:
  release:
    desc: Build, verify, and promote a tagged native Linux release
    cmds:
      - bash taskfiles/linux/funcs.sh validate-release
      - task: install:tooling
      - task: package
        vars:
          FORMAT: all
      - bash taskfiles/linux/funcs.sh release-outputs
  install:deps:
    desc: Install Ubuntu 24.04 or 26.04 native build and packaging dependencies (requires sudo)
    cmds:
      - bash taskfiles/linux/funcs.sh install-deps
  install:tooling:
    desc: Install the module-pinned Wails CLI using the repository Go toolchain
    cmds:
      - bash taskfiles/linux/funcs.sh install-tooling
  build:
    summary: Build Raven on a matching native Linux host
    cmds:
      - bash taskfiles/linux/funcs.sh validate-build
      - task: build:native
        vars:
          OUTPUT: '{{.OUTPUT | default (printf "%s/%s" .BIN_DIR .APP_NAME)}}'
  build:native:
    internal: true
    cmds:
      - bash taskfiles/linux/funcs.sh frontend
      - mkdir -p "$(dirname "$RAVEN_LINUX_OUTPUT")"
      - >-
        {{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}}
        {{.BUILD_FLAGS}} -o "$RAVEN_LINUX_OUTPUT"
    vars:
      PRODUCTION_TAG: '{{if ne .DEV "true"}}production{{end}}'
      OBFUSCATION_TAG: '{{if eq .OBFUSCATED "true"}}wails_obfuscated{{end}}'
      BUILD_TAGS: '{{list .PRODUCTION_TAG .OBFUSCATION_TAG .EXTRA_TAGS | compact | join ","}}'
      BUILD_FLAGS: >-
        {{if .BUILD_TAGS}}-tags {{.BUILD_TAGS}}{{end}} -buildvcs=false
        {{if eq .DEV "true"}}-gcflags=all="-l"{{else}}-trimpath -ldflags="-w -s"{{end}}
    env:
      RAVEN_LINUX_OUTPUT: '{{.OUTPUT}}'
      RAVEN_LINUX_BUILD_FLAGS: '{{.BUILD_FLAGS}}'
      GOOS: linux
      CGO_ENABLED: '1'
      GOARCH: '{{.LINUX_ARCH}}'
  package:
    desc: Build once and package verified Linux installers (VERSION and native ARCH required)
    cmds:
      - bash taskfiles/linux/funcs.sh prepare
      - task: build
        vars:
          OUTPUT: '{{.LINUX_STAGE}}/payload/usr/bin/raven'
      - bash taskfiles/linux/funcs.sh bundle
      - bash taskfiles/linux/funcs.sh verify
      - bash taskfiles/linux/funcs.sh smoke
      - bash taskfiles/linux/funcs.sh promote
  create:deb:
    summary: Build and verify a Debian package
    cmds:
      - task: package
        vars:
          FORMAT: deb
  create:rpm:
    summary: Build and verify an RPM package
    cmds:
      - task: package
        vars:
          FORMAT: rpm
  create:pacman:
    summary: Build and verify an Arch Linux package
    cmds:
      - task: package
        vars:
          FORMAT: pacman
  create:aur:
    summary: Compatibility alias for create:pacman (does not publish to AUR)
    cmds:
      - task: create:pacman
  generate:deb:
    cmds:
      - task: create:deb
  generate:rpm:
    cmds:
      - task: create:rpm
  generate:aur:
    cmds:
      - task: create:pacman
  generate:dotdesktop:
    summary: Generate desktop metadata inside the Linux staging directory
    cmds:
      - bash taskfiles/linux/funcs.sh desktop
  test:
    desc: Test Linux packaging validation and failure handling without native build dependencies
    cmds:
      - bun test ./taskfiles/linux/linux.test.mjs
  run:
    cmds:
      - '"{{.BIN_DIR}}/{{.APP_NAME}}"'
