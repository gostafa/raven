---
version: '3.5'

vars:
  APP_NAME: raven
  BIN_DIR: bin
  PACKAGE_MANAGER: bun
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

env:
  MACOSX_DEPLOYMENT_TARGET: '{{if eq OS "darwin"}}13.0{{end}}'
  CGO_CFLAGS: '{{if eq OS "darwin"}}-mmacosx-version-min=13.0{{end}}'
  CGO_LDFLAGS: '{{if eq OS "darwin"}}-mmacosx-version-min=13.0 -Wl,-no_warn_duplicate_libraries{{end}}'
  GOFLAGS: '{{if eq OS "darwin"}}-ldflags=-extldflags=-mmacosx-version-min=13.0{{end}}'

includes:
  taskotter:
    taskfile: taskotter/Taskfile.yml
    vars:
      GO_JUNIT_REPORT_IN: '{{.GO_JUNIT_REPORT_IN | default "test-result.txt"}}'
      GO_JUNIT_REPORT_OUT: '{{.GO_JUNIT_REPORT_OUT | default "junit.xml"}}'
      ESLINT_TARGETS: frontend/src frontend/tests frontend/tooling frontend/test.config.mjs scripts eslint.config.mjs
      YAMLFIX_EXTRA_ARGS: |-
        {{.YAMLFIX_EXTRA_ARGS | default
        `--exclude "taskotter/**/*" --exclude "node_modules/**/*"`}} --exclude ".golangci.yml"
    dir: .
  common:
    taskfile: ./taskfiles/common/Taskfile.yml
    dir: .
  ci:
    taskfile: ./taskfiles/ci/Taskfile.yml
    dir: .
  conventions:
    taskfile: ./taskfiles/conventions/Taskfile.yml
    dir: .
  windows:
    taskfile: ./taskfiles/windows/Taskfile.yml
    dir: .
  dotnet:
    taskfile: ./taskfiles/dotnet/Taskfile.yml
  wix:
    taskfile: ./taskfiles/wix/Taskfile.yml
    dir: .
  darwin:
    taskfile: ./taskfiles/darwin/Taskfile.yml
    dir: .
  linux:
    taskfile: ./taskfiles/linux/Taskfile.yml
    dir: .

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: '{{.GOOS}}:build'
  package:
    summary: Packages a production build of the application
    cmds:
      - task: '{{.GOOS}}:package'
  run:
    summary: Runs the application
    cmds:
      - task: '{{.GOOS}}:run'
  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
