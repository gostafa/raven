---
version: '3.5'

includes:
  bun:
    taskfile: ../../taskotter/bun/Taskfile.yml
    internal: true

tasks:
  check:
    desc: Check Raven source conventions and feature behavior
    cmds:
      - task: :taskotter:go:test
        vars:
          CLI_ARGS: ./internal/tooling/conventions
      - task: bun:_run:unix
        vars:
          ARGS: run --cwd frontend check
      - task: bun:_run:unix
        vars:
          ARGS: run --cwd frontend test
      - task: bun:_run:unix
        vars:
          ARGS: run --cwd frontend build
