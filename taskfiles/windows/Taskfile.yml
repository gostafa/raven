---
version: '3.5'

includes:
  common: ../common/Taskfile.yml

tasks:
  build:
    summary: Builds the application for Windows
    cmds:
      - task: build:native
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
  build:native:
    summary: Builds the application using native Go cross-compilation
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: >-
          garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0
          (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain
          compatibility.
    cmds:
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - >-
        {{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}}
        {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
      - cmd: powershell Remove-item *.syso
        platforms:
          - windows
      - cmd: rm -f *.syso
        platforms:
          - linux
          - darwin
    vars:
      PRODUCTION_TAG: '{{if ne .DEV "true"}}production{{end}}'
      OBFUSCATION_TAG: '{{if eq .OBFUSCATED "true"}}wails_obfuscated{{end}}'
      BUILD_TAGS: '{{list .PRODUCTION_TAG .OBFUSCATION_TAG .EXTRA_TAGS | compact | join ","}}'
      BUILD_FLAGS: >-
        {{if .BUILD_TAGS}}-tags {{.BUILD_TAGS}}{{end}} -buildvcs=false
        {{if ne .DEV "true"}}-trimpath -ldflags="-w -s -H windowsgui"{{end}}
    env:
      GOOS: windows
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'
      GOARCH: '{{.ARCH | default ARCH}}'
  package:
    summary: Packages the application
    cmds:
      - task: '{{if eq (.FORMAT | default "nsis") "msix"}}create:msix:package{{else}}create:nsis:installer{{end}}'
        vars:
          INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'
    vars:
      FORMAT: '{{.FORMAT | default "nsis"}}'
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'
  generate:syso:
    summary: Generates Windows `.syso` file
    dir: build
    cmds:
      - |-
        wails3 generate syso -arch {{.ARCH
        }} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{
        .ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
  create:inno:installer:
    summary: Creates a Windows x64 Inno Setup installer
    deps:
      - task: build
        vars:
          ARCH: amd64
    preconditions:
      - sh: '[ "{{.ARCH | default "amd64"}}" = "amd64" ]'
        msg: Inno Setup packaging currently supports amd64 only
    cmds:
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/bin"
      - >-
        "{{.ISCC}}" /DAppVersion={{.VERSION}}
        /DBinaryDir="{{.ROOT_DIR}}/bin"
        /O"{{.ROOT_DIR}}/bin"
        "{{.ROOT_DIR}}/build/windows/inno/setup.iss"
    vars:
      ISCC: '{{.ISCC | default "C:/Program Files (x86)/Inno Setup 6/ISCC.exe"}}'
      VERSION: '{{.VERSION | default "0.1.0"}}'
  create:nsis:installer:
    summary: Creates an NSIS installer
    dir: build/windows/nsis
    deps:
      - task: build
    preconditions:
      - sh: '[ "{{.INSTALL_SCOPE}}" = "user" ] || [ "{{.INSTALL_SCOPE}}" = "machine" ]'
        msg: INSTALL_SCOPE must be 'user' or 'machine', got '{{.INSTALL_SCOPE}}'
    cmds:
      # Create the Microsoft WebView2 bootstrapper if it doesn't exist
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      - |
        {{if eq OS "windows"}}
        makensis {{if eq .INSTALL_SCOPE "user"}}-DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user
        }}-DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe" project.nsi
        {{else}}
        makensis {{if eq .INSTALL_SCOPE "user"}}-DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user
        }}-DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" project.nsi
        {{end}}
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      ARG_FLAG: '{{if eq .ARCH "amd64"}}AMD64{{else}}ARM64{{end}}'
      INSTALL_SCOPE: '{{.INSTALL_SCOPE | default "machine"}}'
  create:msix:package:
    summary: Creates an MSIX package
    deps:
      - task: build
    cmds:
      - |-
        wails3 tool msix \
          --config "{{.ROOT_DIR}}/build/config.yml" \
          --name "{{.APP_NAME}}.exe" \
          --executable "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" \
          --arch "{{.ARCH}}" \
          --out "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH}}.msix" \
          {{if .CERT_PATH}}--cert "{{.CERT_PATH}}"{{end}} \
          {{if .PUBLISHER}}--publisher "{{.PUBLISHER}}"{{end}} \
          {{if eq .USE_MSIX_TOOL "true"}}--use-msix-tool{{else}}--use-makeappx{{end}}
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      CERT_PATH: '{{.CERT_PATH | default ""}}'
      PUBLISHER: '{{.PUBLISHER | default ""}}'
      USE_MSIX_TOOL: '{{.USE_MSIX_TOOL | default "false"}}'
  install:msix:tools:
    summary: Installs tools required for MSIX packaging
    cmds:
      - wails3 tool msix-install-tools
  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'
