---
version: "3.5"
vars:
  GO_NIX_INSTALLABLE: '{{.GO_NIX_INSTALLABLE | default "nixpkgs#go"}}'
  GO_WINGET_INSTALLABLE: '{{.GO_WINGET_INSTALLABLE | default "GoLang.Go"}}'
  GO_FUZZTIME: '{{.GO_FUZZTIME | default ""}}'
  GO_PKG: '{{.GO_PKG | default ""}}'
  GO_LOAD: >-
    {{.GO_LOAD | default `
    \$u = [Environment]::GetEnvironmentVariable('Path', 'User');
    if (\$u) { \$env:Path = \$u + ';' + \$env:Path };
    if (Get-Command go -ErrorAction SilentlyContinue) {
      \$goBin = Join-Path ((go env GOPATH).Trim()) 'bin';
      if (Test-Path -LiteralPath \$goBin) { \$env:Path = \$goBin + ';' + \$env:Path }
    }
    `}}
  GOLANGCI_LINT_NIX_INSTALLABLE: '{{.GOLANGCI_LINT_NIX_INSTALLABLE | default "nixpkgs#go nixpkgs#golangci-lint"}}'
  GOLANGCI_LINT_WINGET_INSTALLABLE: '{{.GOLANGCI_LINT_WINGET_INSTALLABLE | default "GolangCI.golangci-lint"}}'
  GOLANGCI_LINT_FMT_FORMATTER_FLAGS: >-
    {{.GOLANGCI_LINT_FMT_FORMATTER_FLAGS | default "-E gci -E gofmt -E gofumpt
    -E goimports -E golines"}}
  ACTIONLINT_NIX_INSTALLABLE: '{{.ACTIONLINT_NIX_INSTALLABLE | default "nixpkgs#actionlint"}}'
  ACTIONLINT_WINGET_INSTALLABLE: '{{.ACTIONLINT_WINGET_INSTALLABLE | default "rhysd.actionlint"}}'
  ACTIONLINT_EXTRA_ARGS: '{{.ACTIONLINT_EXTRA_ARGS | default ""}}'
  ACTIONLINT_TARGETS: '{{.ACTIONLINT_TARGETS | default ""}}'
  YAMLLINT_NIX_INSTALLABLE: '{{.YAMLLINT_NIX_INSTALLABLE | default "nixpkgs#yamllint"}}'
  YAMLLINT_UV_TOOL: '{{.YAMLLINT_UV_TOOL | default "yamllint"}}'
  YAMLLINT_TARGETS: '{{.YAMLLINT_TARGETS | default "."}}'
  YAMLLINT_CONFIG: '{{.YAMLLINT_CONFIG | default ""}}'
  YAMLLINT_EXTRA_ARGS: '{{.YAMLLINT_EXTRA_ARGS | default ""}}'
  YAMLFIX_NIX_INSTALLABLE: '{{.YAMLFIX_NIX_INSTALLABLE | default "nixpkgs#yamlfix"}}'
  YAMLFIX_UV_TOOL: '{{.YAMLFIX_UV_TOOL | default "yamlfix"}}'
  YAMLFIX_TARGETS: '{{.YAMLFIX_TARGETS | default "."}}'
  YAMLFIX_EXTRA_ARGS: '{{.YAMLFIX_EXTRA_ARGS | default ""}}'
  ZIZMOR_EXTRA_ARGS: '{{.ZIZMOR_EXTRA_ARGS | default "--offline"}}'
  ZIZMOR_TARGETS: '{{.ZIZMOR_TARGETS | default ".github"}}'
  ZIZMOR_NIX_INSTALLABLE: '{{.ZIZMOR_NIX_INSTALLABLE | default "nixpkgs#zizmor"}}'
  ZIZMOR_WINGET_INSTALLABLE: '{{.ZIZMOR_WINGET_INSTALLABLE | default "zizmor.zizmor"}}'
  ADRS_NIX_INSTALLABLE: '{{.ADRS_NIX_INSTALLABLE | default "nixpkgs#adrs"}}'
  ADRS_CARGO_CRATE: '{{.ADRS_CARGO_CRATE | default "adrs"}}'
  ADRS_EXTRA_ARGS: '{{.ADRS_EXTRA_ARGS | default ""}}'
  GO_JUNIT_REPORT_NIX_INSTALLABLE: '{{.GO_JUNIT_REPORT_NIX_INSTALLABLE | default "nixpkgs#go-junit-report"}}'
  GO_JUNIT_REPORT_GO_PKG: '{{.GO_JUNIT_REPORT_GO_PKG | default "github.com/jstemmer/go-junit-report/v2@latest"}}'
  GO_JUNIT_REPORT_IN: '{{.GO_JUNIT_REPORT_IN | default ""}}'
  GO_JUNIT_REPORT_OUT: '{{.GO_JUNIT_REPORT_OUT | default ""}}'
  TRIVY_IMAGE: '{{.TRIVY_IMAGE | default ""}}'
  TRIVY_FS_TARGET: '{{.TRIVY_FS_TARGET | default "."}}'
  TRIVY_SCANNERS: '{{.TRIVY_SCANNERS | default "vuln,misconfig,secret,license"}}'
  TRIVY_IMAGE_ARGS: >-
    {{.TRIVY_IMAGE_ARGS | default (printf `--scanners %s
    --image-config-scanners misconfig,secret
    --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 1 --exit-on-eol 1
    --detection-priority comprehensive --ignore-unfixed=false --license-full
    --removed-pkgs --include-deprecated-checks --no-progress` .TRIVY_SCANNERS)}}
  TRIVY_FS_ARGS: >-
    {{.TRIVY_FS_ARGS | default (printf `--scanners %s
    --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --exit-code 1
    --detection-priority comprehensive --ignore-unfixed=false --license-full
    --include-dev-deps --include-deprecated-checks --no-progress` .TRIVY_SCANNERS)}}
  TRIVY_IMAGE_EXTRA_ARGS: '{{.TRIVY_IMAGE_EXTRA_ARGS | default ""}}'
  TRIVY_FS_EXTRA_ARGS: '{{.TRIVY_FS_EXTRA_ARGS | default ""}}'
  TRIVY_NIX_INSTALLABLE: '{{.TRIVY_NIX_INSTALLABLE | default "nixpkgs#trivy"}}'
  TRIVY_WINGET_INSTALLABLE: '{{.TRIVY_WINGET_INSTALLABLE | default "AquaSecurity.Trivy"}}'
  RUMDL_TARGETS: '{{.RUMDL_TARGETS | default "."}}'
  RUMDL_EXTRA_ARGS: '{{.RUMDL_EXTRA_ARGS | default ""}}'
  RUMDL_NIX_INSTALLABLE: '{{.RUMDL_NIX_INSTALLABLE | default "nixpkgs#rumdl"}}'
  RUMDL_WINGET_INSTALLABLE: '{{.RUMDL_WINGET_INSTALLABLE | default "rvben.rumdl"}}'
  ESLINT_TARGETS: '{{.ESLINT_TARGETS | default ""}}'
  ESLINT_DEFAULT_TARGETS: '{{.ESLINT_DEFAULT_TARGETS | default "src/**/*.{js,jsx,ts,tsx}"}}'
  ESLINT_CONFIG: '{{.ESLINT_CONFIG | default ""}}'
  ESLINT_CACHE: '{{.ESLINT_CACHE | default ""}}'
  ESLINT_DEFAULT_CACHE: '{{.ESLINT_DEFAULT_CACHE | default "true"}}'
  ESLINT_EXTRA_ARGS: '{{.ESLINT_EXTRA_ARGS | default ""}}'
  ESLINT_VERSION: '{{.ESLINT_VERSION | default ""}}'
  KNIP_EXTRA_ARGS: '{{.KNIP_EXTRA_ARGS | default ""}}'
  KNIP_CONFIG: '{{.KNIP_CONFIG | default ""}}'
  KNIP_VERSION: '{{.KNIP_VERSION | default ""}}'
  PRETTIER_TARGETS: '{{.PRETTIER_TARGETS | default ""}}'
  PRETTIER_DEFAULT_TARGETS: '{{.PRETTIER_DEFAULT_TARGETS | default "."}}'
  PRETTIER_CONFIG: '{{.PRETTIER_CONFIG | default ""}}'
  PRETTIER_IGNORE_PATH: '{{.PRETTIER_IGNORE_PATH | default ""}}'
  PRETTIER_DEFAULT_IGNORE_PATH: '{{.PRETTIER_DEFAULT_IGNORE_PATH | default ".prettierignore"}}'
  PRETTIER_EXTRA_ARGS: '{{.PRETTIER_EXTRA_ARGS | default ""}}'
  PRETTIER_VERSION: '{{.PRETTIER_VERSION | default ""}}'
  TYPESCRIPT_FILE: '{{.TYPESCRIPT_FILE | default "src/index.ts"}}'
  TYPESCRIPT_OUTFILE: '{{.TYPESCRIPT_OUTFILE | default "dist/index.js"}}'
  TYPESCRIPT_OUT_DIR: '{{.TYPESCRIPT_OUT_DIR | default "dist"}}'
  TYPESCRIPT_TSCONFIG: '{{.TYPESCRIPT_TSCONFIG | default "tsconfig.json"}}'
  TYPESCRIPT_TSX_FLAGS: '{{.TYPESCRIPT_TSX_FLAGS | default ""}}'
  TYPESCRIPT_TSC_FLAGS: '{{.TYPESCRIPT_TSC_FLAGS | default ""}}'
  TYPESCRIPT_TRACE_DIR: '{{.TYPESCRIPT_TRACE_DIR | default ".tsc-trace"}}'
  TYPESCRIPT_VERSION: '{{.TYPESCRIPT_VERSION | default ""}}'
includes:
  go:
    taskfile: go/Taskfile.yml
    dir: ..
    vars:
      GO_NIX_INSTALLABLE: '{{.GO_NIX_INSTALLABLE}}'
      GO_WINGET_INSTALLABLE: '{{.GO_WINGET_INSTALLABLE}}'
      GO_FUZZTIME: '{{.GO_FUZZTIME}}'
      GO_PKG: '{{.GO_PKG}}'
      # \$ so Task's POSIX shell (mvdan/sh) leaves literal $ for PowerShell.
      # Reload User Path (install:pkg writes GOPATH\bin there) and prepend
      # GOPATH\bin so go-installed tools from earlier in this Task process are
      # visible to later PowerShell cmds.
      GO_LOAD: '{{.GO_LOAD}}'
  golangci-lint:
    taskfile: golangci-lint/Taskfile.yml
    dir: ..
    vars:
      GOLANGCI_LINT_NIX_INSTALLABLE: '{{.GOLANGCI_LINT_NIX_INSTALLABLE}}'
      GOLANGCI_LINT_WINGET_INSTALLABLE: '{{.GOLANGCI_LINT_WINGET_INSTALLABLE}}'
      # Formatter selection shared by every golangci-lint fmt invocation on Unix and

      # Windows. Kept in one place so the two call sites cannot drift apart.
      GOLANGCI_LINT_FMT_FORMATTER_FLAGS: '{{.GOLANGCI_LINT_FMT_FORMATTER_FLAGS}}'
  actionlint:
    taskfile: actionlint/Taskfile.yml
    dir: ..
    vars:
      ACTIONLINT_NIX_INSTALLABLE: '{{.ACTIONLINT_NIX_INSTALLABLE}}'
      ACTIONLINT_WINGET_INSTALLABLE: '{{.ACTIONLINT_WINGET_INSTALLABLE}}'
      ACTIONLINT_EXTRA_ARGS: '{{.ACTIONLINT_EXTRA_ARGS}}'
      ACTIONLINT_TARGETS: '{{.ACTIONLINT_TARGETS}}'
  yamllint:
    taskfile: yamllint/Taskfile.yml
    dir: ..
    vars:
      YAMLLINT_NIX_INSTALLABLE: '{{.YAMLLINT_NIX_INSTALLABLE}}'
      YAMLLINT_UV_TOOL: '{{.YAMLLINT_UV_TOOL}}'
      YAMLLINT_TARGETS: '{{.YAMLLINT_TARGETS}}'
      YAMLLINT_CONFIG: '{{.YAMLLINT_CONFIG}}'
      YAMLLINT_EXTRA_ARGS: '{{.YAMLLINT_EXTRA_ARGS}}'
  yamlfix:
    taskfile: yamlfix/Taskfile.yml
    dir: ..
    vars:
      YAMLFIX_NIX_INSTALLABLE: '{{.YAMLFIX_NIX_INSTALLABLE}}'
      YAMLFIX_UV_TOOL: '{{.YAMLFIX_UV_TOOL}}'
      YAMLFIX_TARGETS: '{{.YAMLFIX_TARGETS}}'
      YAMLFIX_EXTRA_ARGS: '{{.YAMLFIX_EXTRA_ARGS}}'
  zizmor:
    taskfile: zizmor/Taskfile.yml
    dir: ..
    vars:
      ZIZMOR_EXTRA_ARGS: '{{.ZIZMOR_EXTRA_ARGS}}'
      ZIZMOR_TARGETS: '{{.ZIZMOR_TARGETS}}'
      ZIZMOR_NIX_INSTALLABLE: '{{.ZIZMOR_NIX_INSTALLABLE}}'
      ZIZMOR_WINGET_INSTALLABLE: '{{.ZIZMOR_WINGET_INSTALLABLE}}'
  adrs:
    taskfile: adrs/Taskfile.yml
    dir: ..
    vars:
      ADRS_NIX_INSTALLABLE: '{{.ADRS_NIX_INSTALLABLE}}'
      ADRS_CARGO_CRATE: '{{.ADRS_CARGO_CRATE}}'
      ADRS_EXTRA_ARGS: '{{.ADRS_EXTRA_ARGS}}'
  go-junit-report:
    taskfile: go-junit-report/Taskfile.yml
    dir: ..
    vars:
      GO_JUNIT_REPORT_NIX_INSTALLABLE: '{{.GO_JUNIT_REPORT_NIX_INSTALLABLE}}'
      GO_JUNIT_REPORT_GO_PKG: '{{.GO_JUNIT_REPORT_GO_PKG}}'
      GO_JUNIT_REPORT_IN: '{{.GO_JUNIT_REPORT_IN}}'
      GO_JUNIT_REPORT_OUT: '{{.GO_JUNIT_REPORT_OUT}}'
  trivy:
    taskfile: trivy/Taskfile.yml
    dir: ..
    vars:
      TRIVY_IMAGE: '{{.TRIVY_IMAGE}}'
      TRIVY_FS_TARGET: '{{.TRIVY_FS_TARGET}}'
      TRIVY_SCANNERS: '{{.TRIVY_SCANNERS}}'
      TRIVY_IMAGE_ARGS: '{{.TRIVY_IMAGE_ARGS}}'
      TRIVY_FS_ARGS: '{{.TRIVY_FS_ARGS}}'
      TRIVY_IMAGE_EXTRA_ARGS: '{{.TRIVY_IMAGE_EXTRA_ARGS}}'
      TRIVY_FS_EXTRA_ARGS: '{{.TRIVY_FS_EXTRA_ARGS}}'
      TRIVY_NIX_INSTALLABLE: '{{.TRIVY_NIX_INSTALLABLE}}'
      TRIVY_WINGET_INSTALLABLE: '{{.TRIVY_WINGET_INSTALLABLE}}'
  rumdl:
    taskfile: rumdl/Taskfile.yml
    dir: ..
    vars:
      RUMDL_TARGETS: '{{.RUMDL_TARGETS}}'
      RUMDL_EXTRA_ARGS: '{{.RUMDL_EXTRA_ARGS}}'
      RUMDL_NIX_INSTALLABLE: '{{.RUMDL_NIX_INSTALLABLE}}'
      RUMDL_WINGET_INSTALLABLE: '{{.RUMDL_WINGET_INSTALLABLE}}'
  eslint:
    taskfile: eslint/Taskfile.yml
    dir: ..
    vars:
      ESLINT_TARGETS: '{{.ESLINT_TARGETS}}'
      ESLINT_DEFAULT_TARGETS: '{{.ESLINT_DEFAULT_TARGETS}}'
      ESLINT_CONFIG: '{{.ESLINT_CONFIG}}'
      ESLINT_CACHE: '{{.ESLINT_CACHE}}'
      ESLINT_DEFAULT_CACHE: '{{.ESLINT_DEFAULT_CACHE}}'
      ESLINT_EXTRA_ARGS: '{{.ESLINT_EXTRA_ARGS}}'
      ESLINT_VERSION: '{{.ESLINT_VERSION}}'
  knip:
    taskfile: knip/Taskfile.yml
    dir: ..
    vars:
      KNIP_EXTRA_ARGS: '{{.KNIP_EXTRA_ARGS}}'
      KNIP_CONFIG: '{{.KNIP_CONFIG}}'
      KNIP_VERSION: '{{.KNIP_VERSION}}'
  prettier:
    taskfile: prettier/Taskfile.yml
    dir: ..
    vars:
      PRETTIER_TARGETS: '{{.PRETTIER_TARGETS}}'
      PRETTIER_DEFAULT_TARGETS: '{{.PRETTIER_DEFAULT_TARGETS}}'
      PRETTIER_CONFIG: '{{.PRETTIER_CONFIG}}'
      PRETTIER_IGNORE_PATH: '{{.PRETTIER_IGNORE_PATH}}'
      PRETTIER_DEFAULT_IGNORE_PATH: '{{.PRETTIER_DEFAULT_IGNORE_PATH}}'
      PRETTIER_EXTRA_ARGS: '{{.PRETTIER_EXTRA_ARGS}}'
      PRETTIER_VERSION: '{{.PRETTIER_VERSION}}'
  typescript:
    taskfile: typescript/Taskfile.yml
    dir: ..
    vars:
      TYPESCRIPT_FILE: '{{.TYPESCRIPT_FILE}}'
      TYPESCRIPT_OUTFILE: '{{.TYPESCRIPT_OUTFILE}}'
      TYPESCRIPT_OUT_DIR: '{{.TYPESCRIPT_OUT_DIR}}'
      TYPESCRIPT_TSCONFIG: '{{.TYPESCRIPT_TSCONFIG}}'
      TYPESCRIPT_TSX_FLAGS: '{{.TYPESCRIPT_TSX_FLAGS}}'
      TYPESCRIPT_TSC_FLAGS: '{{.TYPESCRIPT_TSC_FLAGS}}'
      TYPESCRIPT_TRACE_DIR: '{{.TYPESCRIPT_TRACE_DIR}}'
      TYPESCRIPT_VERSION: '{{.TYPESCRIPT_VERSION}}'
tasks:
  ci:
    desc: Run ci for synced TaskOtter modules
    cmds:
      - task: golangci-lint:ci
      - task: actionlint:ci
      - task: yamllint:ci
      - task: zizmor:ci
      - task: rumdl:ci
      - task: eslint:ci
      - task: knip:ci
      - task: typescript:ci
  ci:fix:
    desc: Run ci:fix for synced TaskOtter modules
    cmds:
      - task: golangci-lint:ci:fix
      - task: yamlfix:ci:fix
      - task: rumdl:ci:fix
      - task: eslint:ci:fix
      - task: knip:ci:fix
      - task: prettier:ci:fix
  config:init:
    desc: Run config:init for synced TaskOtter modules
    cmds:
      - task: yamllint:config:init
      - task: eslint:config:init
      - task: knip:config:init
      - task: prettier:config:init
      - task: typescript:config:init
  fmt:check:
    desc: Run fmt:check for synced TaskOtter modules
    cmds:
      - task: golangci-lint:fmt:check
      - task: prettier:fmt:check
  help:
    desc: Run help for synced TaskOtter modules
    cmds:
      - task: eslint:help
      - task: knip:help
      - task: prettier:help
  install:
    desc: Run install for synced TaskOtter modules
    cmds:
      - task: go:install
      - task: golangci-lint:install
      - task: actionlint:install
      - task: yamllint:install
      - task: yamlfix:install
      - task: zizmor:install
      - task: adrs:install
      - task: go-junit-report:install
      - task: trivy:install
      - task: rumdl:install
      - task: eslint:install
      - task: knip:install
      - task: prettier:install
      - task: typescript:install
  install:undo:
    desc: Run install:undo for synced TaskOtter modules
    cmds:
      - task: eslint:install:undo
      - task: knip:install:undo
      - task: prettier:install:undo
      - task: typescript:install:undo
  upgrade:
    desc: Run upgrade for synced TaskOtter modules
    cmds:
      - task: eslint:upgrade
      - task: knip:upgrade
      - task: prettier:upgrade
      - task: typescript:upgrade
  verify:
    desc: Run verify for synced TaskOtter modules
    cmds:
      - task: go:verify
      - task: go-junit-report:verify
  version:
    desc: Run version for synced TaskOtter modules
    cmds:
      - task: go:version
      - task: golangci-lint:version
      - task: actionlint:version
      - task: yamllint:version
      - task: yamlfix:version
      - task: zizmor:version
      - task: adrs:version
      - task: go-junit-report:version
      - task: trivy:version
      - task: rumdl:version
      - task: eslint:version
      - task: knip:version
      - task: prettier:version
      - task: typescript:version
  which:
    desc: Run which for synced TaskOtter modules
    cmds:
      - task: go:which
      - task: go-junit-report:which
